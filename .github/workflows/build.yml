name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: bash
        run: |
          python -m pip install pyinstaller -r requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name AI_Assistant \
            --icon assets/app.ico --add-data "assets;assets" \
            --hidden-import pystray._win32 --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 \
            --hidden-import keyring.backends.Windows --collect-data speech_recognition \
            --hidden-import sounddevice --collect-all uiautomation --collect-all sounddevice --collect-all _sounddevice_data main.py
      - name: Build Setup.exe
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          export APP_VERSION=$(python -c "import config;print(config.APP_VERSION)")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Assistant
          path: |
            dist/AI_Assistant.exe
            dist/AI_Assistant_Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI_Assistant_Setup.exe
            dist/AI_Assistant.exe
